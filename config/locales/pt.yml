pt:
  redmine_mcp_plugin:
    settings:
      section_endpoint: Endpoint
      section_authentication: Modos de autenticacao
      section_behaviour: Comportamento
      enabled: Activar o endpoint MCP
      enabled_hint: "Responde a POST %{url}. Desactivado por omissao."
      auth_oauth2: OAuth2 (recomendado)
      auth_oauth2_hint: "Tokens por utilizador emitidos pelo fornecedor OAuth2 do proprio Redmine. Cada token esta limitado aos scopes que lhe foram concedidos, podendo ser mais restrito do que o utilizador. Registe aplicacoes em Administracao > Aplicacoes."
      auth_api_key: Chave da API REST
      auth_api_key_hint: "O cabecalho X-Redmine-API-Key, como na API REST. Identifica o utilizador mas carrega todas as suas permissoes - nao ha forma de as restringir."
      auth_basic: HTTP Basic
      auth_basic_hint: "Utilizador e palavra-passe, ou uma chave de API como utilizador. Envia credenciais reutilizaveis em cada pedido. Recusado em contas com autenticacao de dois factores activa."
      auth_session: Cookie de sessao do browser
      auth_session_hint: "Aceita uma sessao Redmine ja iniciada. So e util para clientes que corram dentro do browser, e e o unico modo exposto a cross-site request forgery - os pedidos sao rejeitados se o cabecalho Origin nao corresponder a este Redmine ou a uma entrada abaixo."
      read_only: Modo apenas-leitura
      read_only_hint: "Esconde e recusa todas as ferramentas que criem ou alterem dados. Activo por omissao."
      sign_in_write_scopes: Scopes de escrita pedidos no inicio de sessao
      sign_in_write_scopes_hint: "Com o modo apenas-leitura desligado, os clientes OAuth pedem estes scopes ao iniciar sessao. Todas as aplicacoes OAuth em Administracao > Aplicacoes tem de permitir cada scope marcado, ou o inicio de sessao atraves delas falha com invalid_scope. Actualizar o plugin nunca marca um scope novo: permita-o primeiro nas aplicacoes e depois marque-o aqui. As ligacoes existentes mantem os seus tokens; os utilizadores so voltam a ligar para usar um scope acabado de marcar. Via OAuth, uma ferramenta de escrita cujo scope nao esteja marcado fica escondida, a menos que o token ja o tenha."
      sign_in_scopes_warning: "Estas aplicacoes OAuth nao permitem todos os scopes pedidos no inicio de sessao. O inicio de sessao atraves delas falha com invalid_scope (nos scopes de escrita, quando o modo apenas-leitura estiver desligado). Permita os scopes em falta em Administracao > Aplicacoes, ou desmarque-os abaixo:"
      allowed_origins: Origens adicionais permitidas
      allowed_origins_hint: "Uma por linha, por exemplo https://app.example.com. A origem deste Redmine e sempre permitida. Pedidos sem cabecalho Origin - o caso habitual para clientes MCP fora do browser - nao sao afectados."
      max_results: Maximo de resultados por chamada
      max_results_hint: "Limite superior de linhas devolvidas por uma ferramenta. Limitado a %{max}."
      dcr_enabled: Activar registo dinamico de clientes (RFC 7591)
      dcr_enabled_hint: "Desactivado por omissao. Quando activo, abre um endpoint de registo sem autenticacao onde qualquer cliente pode registar uma aplicacao OAuth2."
      rest_api_warning: "A API REST esta desactivada em Administracao > Configuracao > API, o que desactiva tambem a autenticacao OAuth2, por chave de API e HTTP Basic neste endpoint."
      no_auth_warning: "Nenhum modo de autenticacao esta activo, pelo que o endpoint vai recusar todos os pedidos."
      tab_general: Geral
      tab_prompts: Prompts
      prompts_intro: "Os prompts sao guardados na base de dados e oferecidos a todos os utilizadores autenticados. Adicione, renomeie ou elimine-os aqui; as suas instrucoes nomeiam ferramentas de leitura que continuam a ser autorizadas individualmente."
      server_instructions: Instrucoes do servidor
      server_instructions_hint: "Enviadas a cada cliente quando se liga. A maioria dos clientes junta-as ao contexto do modelo durante toda a conversa."
      prompt_name: Nome
      prompt_machine_name: Nome de maquina
      prompt_machine_name_hint: "Apenas letras minusculas, numeros e underscores. E o nome que os clientes MCP usam para invocar o prompt."
      prompt_description: Descricao
      prompt_text: Prompt
      prompt_new: Novo prompt
      prompt_untitled: Prompt sem titulo
      prompt_delete_confirm: Eliminar este prompt?
      prompt_request_hint: "Escreva %{placeholder} onde deve ficar o pedido do utilizador. Sem isso, o pedido e acrescentado no fim."
      restore_default: Repor texto por omissao
      tab_tools: Ferramentas
      tools_intro: "O que cada ferramenta diz aos clientes de IA sobre si e os seus parametros. So as descricoes sao editaveis: os nomes, tipos e parametros obrigatorios sao fixos, porque cada chamada e validada com eles. Todas as ferramentas aparecem, incluindo as que o modo so de leitura ou as permissoes de um utilizador escondem. Os clientes costumam obter a lista de ferramentas uma vez por ligacao, por isso as alteracoes aplicam-se quando voltam a ligar."
      tool_description: Descricao
      parameter_required: obrigatorio
      edited: alterado
      restore_defaults: Repor textos por omissao
